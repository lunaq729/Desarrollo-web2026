{% extends "base.html" %}

{% block content %}
<div class="container mt-5 mb-5">
    <h2 class="fw-bold text-center mb-4 text-dark">Registro de Facturación</h2>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            {% for factura in facturas %}
            <div class="alert alert-secondary shadow-sm d-flex justify-content-between align-items-center mb-3" role="alert">
                <div>
                    <h6 class="fw-bold mb-0">Factura N° {{ factura.numero }}</h6>
                    <small>Cliente: {{ factura.cliente }}</small>
                </div>
                <h5 class="fw-bold text-success mb-0">${{ factura.total }}</h5>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
